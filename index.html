<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SWAIS · AI Agents, Automation &amp; Custom Systems</title>
    <meta name="description" content="SWAIS engineers done-for-you AI agents, automation systems, dashboards, websites and apps. Built for businesses that want to scale without adding headcount.">
    <meta name="author" content="SWAIS" />
    <link rel="canonical" href="https://swais.net" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <link rel="preload" as="video" href="/hero-bg.mp4" type="video/mp4" fetchpriority="high" />
    <link rel="preload" as="image" href="/favicon.png" />

    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        background: #061437;
      }

      #hero-boot-shell {
        position: fixed;
        inset: 0;
        z-index: 30;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 20%, rgb(82 133 255 / 0.24), transparent 46%),
          #061437;
        transition: opacity 0.42s ease, visibility 0.42s ease;
      }

      #hero-boot-shell.is-hidden {
        opacity: 0;
        visibility: hidden;
      }

      #hero-boot-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      #hero-boot-shell::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgb(4 10 25 / 0.72), rgb(4 10 25 / 0.18) 45%, rgb(4 10 25 / 0.08));
        pointer-events: none;
      }

      #hero-boot-progress-wrap {
        position: absolute;
        inset: 0 0 auto;
        height: 3px;
        background: rgb(255 255 255 / 0.08);
        z-index: 2;
      }

      #hero-boot-progress {
        height: 100%;
        width: 6%;
        background: linear-gradient(90deg, #6ea9ff, #d8e6ff);
        box-shadow: 0 0 18px rgb(110 169 255 / 0.45);
        transition: width 0.18s ease;
      }
    </style>

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://swais.net" />
    <meta property="og:title" content="SWAIS · AI Agents, Automation &amp; Custom Systems">
    <meta property="og:description" content="SWAIS engineers done-for-you AI agents, automation systems, dashboards, websites and apps. Built for businesses that want to scale without adding headcount.">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SWAIS · AI Agents, Automation &amp; Custom Systems">
    <meta name="twitter:description" content="SWAIS engineers done-for-you AI agents, automation systems, dashboards, websites and apps. Built for businesses that want to scale without adding headcount.">
  </head>

  <body>
    <div id="hero-boot-shell" aria-hidden="true">
      <video id="hero-boot-video" autoplay muted loop playsinline preload="auto" src="/hero-bg.mp4"></video>
      <div id="hero-boot-progress-wrap"><div id="hero-boot-progress"></div></div>
    </div>
    <div id="root"></div>
    <script>
      (() => {
        const shell = document.getElementById("hero-boot-shell");
        const video = document.getElementById("hero-boot-video");
        const progress = document.getElementById("hero-boot-progress");

        if (!(shell instanceof HTMLElement) || !(video instanceof HTMLVideoElement) || !(progress instanceof HTMLElement)) {
          return;
        }

        let value = 6;
        let raf = 0;

        const paint = (next) => {
          progress.style.width = `${Math.max(6, Math.min(100, next))}%`;
        };

        const tick = () => {
          value = Math.min(value + 0.45, 78);
          paint(value);
          raf = requestAnimationFrame(tick);
        };

        const finish = () => {
          cancelAnimationFrame(raf);
          value = 100;
          paint(value);
        };

        const tryPlay = () => {
          const playPromise = video.play();
          if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch(() => {});
          }
        };

        paint(value);
        tick();
        tryPlay();

        video.addEventListener("loadeddata", () => {
          value = Math.max(value, 84);
          paint(value);
        }, { once: true });

        video.addEventListener("canplay", finish, { once: true });
        video.addEventListener("playing", finish, { once: true });

        window.addEventListener("swais:hero-handoff", () => {
          finish();
          shell.classList.add("is-hidden");
          window.setTimeout(() => shell.remove(), 450);
        }, { once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
